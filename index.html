```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOXMAXY</title>

<style>
body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial;
    text-align: center;
}

header {
    padding: 20px;
    background: #111;
    border-bottom: 2px solid #00aaff;
}

h1 {
    margin: 0;
    color: #00aaff;
}

.container {
    max-width: 400px;
    margin: 60px auto;
    padding: 25px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    border-radius: 6px;
    background: #00aaff;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0088cc;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    box-sizing: border-box;
    background: #151515;
    color: white;
    border: 1px solid #333;
    border-radius: 5px;
}

.box {
    background: #111;
    padding: 25px;
    border-radius: 10px;
    border: 1px solid #222;
}

.hidden {
    display: none;
}

.msg {
    margin-top: 15px;
    font-size: 14px;
}

.user {
    background: #181818;
    padding: 12px;
    margin-top: 8px;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.delete {
    width: auto;
    margin: 0;
    background: #cc3333;
    padding: 8px;
}

.logout {
    background: #cc3333;
}

.admin {
    color: #00aaff;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>BLOXMAXY</h1>
</header>

<div class="container">

    <!-- LOGIN -->
    <div id="login" class="box">

        <h2>Entrar</h2>

        <input id="loginUser" placeholder="Usuário">
        <input id="loginPass" type="password" placeholder="Senha">

        <button onclick="login()">ENTRAR</button>
        <button onclick="mostrarCadastro()">CRIAR CONTA</button>

        <div id="loginMsg" class="msg"></div>

    </div>


    <!-- CADASTRO -->
    <div id="cadastro" class="box hidden">

        <h2>Criar conta</h2>

        <input id="newUser" placeholder="Usuário">
        <input id="newPass" type="password" placeholder="Senha">

        <button onclick="criarConta()">CRIAR CONTA</button>
        <button onclick="mostrarLogin()">VOLTAR</button>

        <div id="cadastroMsg" class="msg"></div>

    </div>


    <!-- ÁREA DO USUÁRIO -->
    <div id="usuario" class="box hidden">

        <h2>Bem-vindo!</h2>

        <p id="nomeUsuario"></p>

        <button onclick="sair()" class="logout">
            SAIR
        </button>

    </div>


    <!-- ADM -->
    <div id="adm" class="box hidden">

        <h2 class="admin">👑 PAINEL ADM</h2>

        <p>Usuários cadastrados:</p>

        <div id="listaUsuarios"></div>

        <button onclick="sair()" class="logout">
            SAIR
        </button>

    </div>

</div>


<script>

/* =====================================
   CONTA ADM
===================================== */

const ADM_USER = "admenzo";
const ADM_PASS = "souceo";


/* =====================================
   PEGAR USUÁRIOS
===================================== */

function pegarUsuarios() {

    return JSON.parse(
        localStorage.getItem("bloxmaxyUsuarios") || "[]"
    );

}


/* =====================================
   SALVAR USUÁRIOS
===================================== */

function salvarUsuarios(usuarios) {

    localStorage.setItem(
        "bloxmaxyUsuarios",
        JSON.stringify(usuarios)
    );

}


/* =====================================
   MOSTRAR LOGIN
===================================== */

function mostrarLogin() {

    document.getElementById("login")
        .classList.remove("hidden");

    document.getElementById("cadastro")
        .classList.add("hidden");

}


/* =====================================
   MOSTRAR CADASTRO
===================================== */

function mostrarCadastro() {

    document.getElementById("login")
        .classList.add("hidden");

    document.getElementById("cadastro")
        .classList.remove("hidden");

}


/* =====================================
   CRIAR CONTA
===================================== */

function criarConta() {

    const user =
        document.getElementById("newUser")
        .value.trim();

    const pass =
        document.getElementById("newPass")
        .value;

    const msg =
        document.getElementById("cadastroMsg");


    if (!user || !pass) {

        msg.textContent =
            "Preencha todos os campos.";

        return;

    }


    if (user.toLowerCase() === ADM_USER) {

        msg.textContent =
            "Esse nome é reservado.";

        return;

    }


    let usuarios = pegarUsuarios();


    if (
        usuarios.some(
            u => u.user.toLowerCase() === user.toLowerCase()
        )
    ) {

        msg.textContent =
            "Esse usuário já existe.";

        return;

    }


    usuarios.push({

        user: user,
        pass: pass

    });


    salvarUsuarios(usuarios);


    msg.textContent =
        "✅ Conta criada! Agora entre.";


    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

}


/* =====================================
   LOGIN
===================================== */

function login() {

    const user =
        document.getElementById("loginUser")
        .value.trim();

    const pass =
        document.getElementById("loginPass")
        .value;

    const msg =
        document.getElementById("loginMsg");


    /* ADM */

    if (
        user.toLowerCase() === ADM_USER &&
        pass === ADM_PASS
    ) {

        document.getElementById("login")
            .classList.add("hidden");

        document.getElementById("adm")
            .classList.remove("hidden");

        carregarUsuarios();

        msg.textContent = "";

        return;

    }


    /* USUÁRIO NORMAL */

    const usuarios = pegarUsuarios();


    const encontrado =
        usuarios.find(
            u =>
                u.user.toLowerCase() === user.toLowerCase() &&
                u.pass === pass
        );


    if (!encontrado) {

        msg.textContent =
            "❌ Usuário ou senha incorretos.";

        return;

    }


    document.getElementById("login")
        .classList.add("hidden");

    document.getElementById("usuario")
        .classList.remove("hidden");


    document.getElementById("nomeUsuario")
        .textContent =
        "Você entrou como: " + encontrado.user;

}


/* =====================================
   CARREGAR USUÁRIOS NO ADM
===================================== */

function carregarUsuarios() {

    const lista =
        document.getElementById("listaUsuarios");

    const usuarios =
        pegarUsuarios();


    lista.innerHTML = "";


    if (usuarios.length === 0) {

        lista.innerHTML =
            "<p>Nenhum usuário cadastrado.</p>";

        return;

    }


    usuarios.forEach(function(usuario, index) {

        const div =
            document.createElement("div");

        div.className = "user";


        div.innerHTML = `
            <span>👤 ${usuario.user}</span>
            <button
                class="delete"
                onclick="excluirUsuario(${index})">
                EXCLUIR
            </button>
        `;


        lista.appendChild(div);

    });

}


/* =====================================
   EXCLUIR USUÁRIO
===================================== */

function excluirUsuario(index) {

    if (
        !confirm(
            "Tem certeza que quer excluir esse usuário?"
        )
    ) {

        return;

    }


    let usuarios =
        pegarUsuarios();


    usuarios.splice(index, 1);


    salvarUsuarios(usuarios);


    carregarUsuarios();

}


/* =====================================
   SAIR
===================================== */

function sair() {

    document.getElementById("usuario")
        .classList.add("hidden");

    document.getElementById("adm")
        .classList.add("hidden");

    document.getElementById("login")
        .classList.remove("hidden");


    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    document.getElementById("loginMsg").textContent = "";

}

</script>

</body>
</html>
